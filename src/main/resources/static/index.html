<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable API</title>
    <link rel="icon" type="image/jpeg" href="/logo.jpg">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #333;
        }
        .logo-container {
            margin-bottom: 2rem;
        }
        .logo {
            width: 150px;
            height: 150px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #2c3e50;
        }
        p {
            font-size: 1.2rem;
            color: #6c757d;
        }
        .status {
            margin-top: 2rem;
            padding: 10px 20px;
            background-color: #e8f5e9;
            color: #2e7d32;
            border-radius: 50px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="/logo.jpg" alt="Timetable Application Logo" class="logo">
    </div>
    <h1>Timetable API</h1>
    <p>Backend services are running successfully.</p>
    <div class="status">System Online</div>
</body>
</html>
